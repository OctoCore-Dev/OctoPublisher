name: OctoPublisher CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore OctoPublisher.slnx

      - name: Build solution
        run: dotnet build OctoPublisher.slnx -c Release --no-restore

      - name: Run unit tests
        run: dotnet test tests\OctoPublisher.Tests\OctoPublisher.Tests.csproj -c Release --no-build --verbosity normal

      - name: Pack .NET Global Tool
        run: dotnet pack src\OctoPublisher.Cli\OctoPublisher.Cli.csproj -c Release --no-build -o artifacts/nuget

      - name: Upload Tool Artifact
        uses: actions/upload-artifact@v4
        with:
          name: octopublisher-nuget
          path: artifacts/nuget/*.nupkg

  build-standalone:
    name: Build Standalone Binaries
    needs: build-and-test
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            output_name: octopublish-win-x64.exe
          - os: ubuntu-latest
            rid: linux-x64
            output_name: octopublish-linux-x64
          - os: macos-latest
            rid: osx-arm64
            output_name: octopublish-osx-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Single-File Binary
        shell: bash
        run: |
          dotnet publish src/OctoPublisher.Cli/OctoPublisher.Cli.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -o dist

      - name: Rename Artifact
        shell: bash
        run: |
          if [ -f dist/octopublish.exe ]; then
            mv dist/octopublish.exe dist/${{ matrix.output_name }}
          else
            mv dist/octopublish dist/${{ matrix.output_name }}
          fi

      - name: Upload Standalone Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, build-standalone]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
