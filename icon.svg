<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgPlate" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#151A2E"/>
      <stop offset="60%" stop-color="#0C0F1A"/>
      <stop offset="100%" stop-color="#06080E"/>
    </radialGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0C0F1A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nugetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="50%" stop-color="#005A9E"/>
      <stop offset="100%" stop-color="#004173"/>
    </linearGradient>

    <linearGradient id="nugetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005A9E"/>
      <stop offset="50%" stop-color="#004173"/>
      <stop offset="100%" stop-color="#002B4D"/>
    </linearGradient>

    <linearGradient id="nugetInterior" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#061226"/>
      <stop offset="100%" stop-color="#0A1D3A"/>
    </linearGradient>

    <linearGradient id="flapFrontLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E90FF"/>
      <stop offset="100%" stop-color="#0066B8"/>
