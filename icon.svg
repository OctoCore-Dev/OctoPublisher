    <g transform="translate(232, 130)">
      <rect x="0" y="0" width="84" height="84" rx="22" fill="url(#octoIndigo)" stroke="rgba(255, 255, 255, 0.55)" stroke-width="2"/>
      <rect x="3" y="3" width="78" height="78" rx="19" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" fill="none"/>
